<svg xmlns="http://www.w3.org/2000/svg" width="600" height="1310" viewBox="0 0 600 1310" role="img" aria-labelledby="title desc">
<title id="title">How the meal-planning workflow runs</title>
<desc id="desc">/setup saves a household profile. Then five phases run as Claude Code agents: 1 brainstorming suggests 10 to 20 dishes and you pick; 2 one recipe-researcher per dish runs in parallel, plus a recipe-creator, and you approve the recipes; 3 the shopping list is pooled and you approve it; 4 the recipe collection and 5 the meal-prep plan run on their own. Notion export and Mathem cart are optional extras, off by default.</desc>
<style>
