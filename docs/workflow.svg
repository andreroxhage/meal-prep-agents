  .line { fill: none; stroke: #a9a69d; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }
  .dot { fill: #a9a69d; }
  .i { fill: none; stroke: #5c5a54; stroke-width: 1.75; stroke-linecap: round; stroke-linejoin: round; }
  .i-you { fill: none; stroke: #fafaf7; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
  .t-title { font-size: 14.5px; font-weight: 600; fill: #34322e; }
  .t-detail { font-size: 13px; fill: #5c5a54; }
  .t-step { font-size: 12px; fill: #6f6c66; font-variant-numeric: tabular-nums; letter-spacing: 0.04em; }
  .t-file { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 11.5px; fill: #6f6c66; }
  .t-chip { font-size: 12.5px; fill: #4a4843; }
  .t-you { font-size: 12.5px; font-weight: 500; fill: #fafaf7; }
  .t-small { font-size: 12px; fill: #5c5a54; }
  .t-label { font-size: 12px; fill: #6f6c66; letter-spacing: 0.02em; }
  @media (prefers-color-scheme: dark) {
    .bg { fill: #1e1d1b; }
    .card { fill: #282725; stroke: #393834; }
    .iconbox { fill: #1e1d1b; }
    .lane { fill: #1e1d1b; stroke: #393834; }
    .chip { fill: #282725; stroke: #45433f; }
    .chip-you { fill: #ecebe6; }
    .group, .opt { stroke: #57554f; }
    .line { stroke: #77746d; }
    .dot { fill: #77746d; }
    .i { stroke: #d6d3cc; }
    .i-you { stroke: #24231f; }
    .t-title { fill: #f5f4f0; }
    .t-detail, .t-small { fill: #d0cdc6; }
    .t-step, .t-file, .t-label { fill: #aaa69e; }
    .t-chip { fill: #e2dfd8; }
    .t-you { fill: #24231f; }
  }
</style>
