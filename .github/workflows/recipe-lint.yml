name: Receptstandard

on:
  pull_request:
    paths:
      - "recipe/**/*.md"
      - "**/recept-*.md"
      - "**/04-alla-recept.md"
      - ".claude/hooks/**"

  # Manuell körning. Utan den går ett jobb som fallit på något utanför repot
  # (låst konto, runner-brist) bara att köra om via "Re-run failed jobs", vilket
  # kräver skrivrättigheter på Actions. workflow_dispatch ger en knapp som räcker.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    # 3.9 är python3 i macOS och golvet README:n lovar; senaste för att fånga det som tas bort.
    strategy:
      matrix:
        python-version: ["3.9", "3.14"]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Kör validatorns egna test
        run: |
          python3 .claude/hooks/test_validate.py
          python3 .claude/hooks/test_validate_week.py

      # Endast filer som ändras i denna PR kontrolleras. Äldre recept som inte
      # följer standarden ska inte blockera orelaterade ändringar.
      - name: Hitta ändrade receptfiler
        id: changed
        run: |
          # Vid pull_request är base_ref målgrenen. Vid workflow_dispatch är den
          # tom — jämför då mot default-grenen, så en manuell körning kontrollerar
          # samma sak som PR:en hade gjort och inte hela det omigrerade repot.
          base="${{ github.base_ref || github.event.repository.default_branch }}"
          git diff --name-only --diff-filter=d \
            "origin/$base...${{ github.sha }}" \
            | grep -E '^recipe/.*\.md$|(^|/)recept-[^/]*\.md$|(^|/)04-alla-recept\.md$' \
            > changed.txt || true
          echo "count=$(wc -l < changed.txt)" >> "$GITHUB_OUTPUT"
          cat changed.txt

      - name: Validera mot receptstandarden
        if: steps.changed.outputs.count != '0'
        run: xargs -a changed.txt python3 .claude/hooks/validate_recipe.py

      - name: Korskontrollera handlingslista mot receptsamling
        if: steps.changed.outputs.count != '0'
        run: |
          status=0
          for dir in $(xargs -a changed.txt -n1 dirname | sort -u); do
            if [ -f "$dir/03-handlingslista.md" ] && [ -f "$dir/04-alla-recept.md" ]; then
              python3 .claude/hooks/validate_week.py "$dir" || status=1
            fi
          done
          exit $status
