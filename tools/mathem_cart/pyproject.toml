[project]
name = "mathem-cart"
version = "0.1.0"
license = "MIT"
description = "Experimentell Fas 6: fyll Mathem-varukorgen från veckans handlingslista. Lägger aldrig en beställning."
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "ruamel.yaml>=0.18",
    "python-dotenv>=1.0",
]

[project.scripts]
mathem-cart = "mathem_cart.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["mathem_cart"]

[tool.pytest.ini_options]
testpaths = ["tests"]
